# Dev DB: config matches config/database.dev.yml
# Schemas in database/ are run on first start only (initdb).

services:
  postgres:
    image: postgres:17
    container_name: dai-postgres-dev
    environment:
      POSTGRES_DB: dai_dev
      POSTGRES_USER: dai_dev_user
      POSTGRES_PASSWORD: dai_dev_password
    ports:
      - "5432:5432"
    volumes:
      - dai_pgdata:/var/lib/postgresql/data
      # Init script runs schema + migration against dai_dev (first start only)
      - ./database/init-dev.sh:/docker-entrypoint-initdb.d/00-init-dev.sh
      - ./database/bootstrap.sql:/docker-entrypoint-initdb.d/bootstrap.raw
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.raw
      - ./database/migration_instructor_features.sql:/docker-entrypoint-initdb.d/migration.raw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dai_dev_user -d dai_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dai_pgdata:
